name: Content Source Cleanup

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**"
      - "scripts/content-source-cleanup.mjs"
      - "scripts/content-legacy-markup-cleanup.mjs"
      - "scripts/content-quality.mjs"
      - ".github/workflows/content-source-cleanup.yml"
  pull_request:
    paths:
      - "src/content/blog/**"
      - "scripts/content-source-cleanup.mjs"
      - "scripts/content-legacy-markup-cleanup.mjs"
      - "scripts/content-quality.mjs"
      - ".github/workflows/content-source-cleanup.yml"

permissions:
  contents: read

jobs:
  normalize:
    name: Validate migrated article sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require normalized article sources
        run: npm run content:cleanup:check

      - name: Require clean legacy markup
        run: npm run content:legacy-cleanup:check

      - name: Require clean source quality
        run: npm run content:quality:strict

      - name: Validate production build and rendered output
        run: npm run build
