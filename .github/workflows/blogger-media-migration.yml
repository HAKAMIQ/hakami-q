name: Blogger Media Migration

on:
  push:
    branches:
      - migrate/blogger-media

permissions:
  contents: write

concurrency:
  group: blogger-media-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Localize Blogger media
        run: node scripts/migrate-blogger-media.mjs
        env:
          BLOGGER_MEDIA_REPORT: reports/blogger-media-migration.json
          BLOGGER_MEDIA_MAX_FILE_BYTES: 25165824
          BLOGGER_MEDIA_MAX_TOTAL_BYTES: 471859200
          BLOGGER_MEDIA_MAX_FILES: 12000
          BLOGGER_MEDIA_CONCURRENCY: 6

      - name: Validate production build
        run: npm run build

      - name: Validate header regression guard
        run: node scripts/header-utility-quality.mjs

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-media-migration-report
          path: reports/blogger-media-migration.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit localized media
        run: |
          git add src/content/blog public/media/blogger
          if git diff --cached --quiet; then
            echo "No Blogger media changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: localize Blogger media"
          git push origin HEAD:${GITHUB_REF_NAME}
