name: Deploy HAKAMIQ Pages

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - chore/hakamiq-pages-domain
    paths:
      - ".github/workflows/deploy-hakamiq-pages.yml"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "functions/**"
      - "public/**"
      - "src/**"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: a1844149abc6a29c5e9bfaf923fc194a
  CLOUDFLARE_PAGES_PROJECT: hakamiq

jobs:
  deploy:
    name: Provision and deploy hakamiq.pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Cloudflare authentication
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; Cloudflare provisioning is skipped."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm ci

      - name: Validate and build site
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          status="$(curl --silent --show-error --output /tmp/pages-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            "$api")"

          if [[ "$status" == "200" ]]; then
            echo "Cloudflare Pages project ${CLOUDFLARE_PAGES_PROJECT} already exists."
          elif [[ "$status" == "404" ]]; then
            create_status="$(curl --silent --show-error --output /tmp/pages-create.json --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"name":"hakamiq","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
            if [[ "$create_status" != "200" && "$create_status" != "201" ]]; then
              cat /tmp/pages-create.json
              exit 1
            fi
            echo "Created Cloudflare Pages project ${CLOUDFLARE_PAGES_PROJECT}."
          else
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy site and Pages Functions
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name "${CLOUDFLARE_PAGES_PROJECT}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "Deploy ${GITHUB_SHA::7} to hakamiq.pages.dev"

      - name: Verify production hostname
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 20 https://hakamiq.pages.dev/ >/dev/null; then
              echo "hakamiq.pages.dev is reachable."
              exit 0
            fi
            sleep 5
          done
          echo "hakamiq.pages.dev did not become reachable within the verification window."
          exit 1
