name: Account System Build

on:
  push:
    branches:
      - main
    paths:
      - 'functions/_lib/auth.js'
      - 'functions/_lib/mfa.js'
      - 'functions/_lib/mfa-session.js'
      - 'functions/admin/**'
      - 'functions/api/admin/**'
      - 'functions/api/auth/**'
      - 'functions/api/mfa/**'
      - 'migrations/**'
      - 'src/pages/login.astro'
      - 'src/pages/register.astro'
      - 'src/pages/account.astro'
      - 'src/pages/admin/**'
      - 'src/styles/account-system.css'
      - 'scripts/admin-cutover-self-test.mjs'
      - 'scripts/auth-login-middleware-self-test.mjs'
      - 'scripts/auth-password-self-test.mjs'
      - 'scripts/mfa-self-test.mjs'
      - 'scripts/setup-auth-production.ps1'
      - 'wrangler.jsonc'
      - '.github/workflows/account-system-build.yml'
  pull_request:
    paths:
      - 'functions/_lib/auth.js'
      - 'functions/_lib/mfa.js'
      - 'functions/_lib/mfa-session.js'
      - 'functions/admin/**'
      - 'functions/api/admin/**'
      - 'functions/api/auth/**'
      - 'functions/api/mfa/**'
      - 'migrations/**'
      - 'src/pages/login.astro'
      - 'src/pages/register.astro'
      - 'src/pages/account.astro'
      - 'src/pages/admin/**'
      - 'src/styles/account-system.css'
      - 'scripts/admin-cutover-self-test.mjs'
      - 'scripts/auth-login-middleware-self-test.mjs'
      - 'scripts/auth-password-self-test.mjs'
      - 'scripts/mfa-self-test.mjs'
      - 'scripts/setup-auth-production.ps1'
      - 'wrangler.jsonc'
      - '.github/workflows/account-system-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Pages Functions syntax
        run: |
          node --check functions/_lib/auth.js
          node --check functions/_lib/mfa.js
          node --check functions/_lib/mfa-session.js
          node --check functions/admin/_middleware.js
          node --check functions/api/admin/_middleware.js
          node --check functions/api/auth/_middleware.js
          node --check 'functions/api/admin/[[path]].js'
          node --check 'functions/api/auth/[[path]].js'
          node --check 'functions/api/mfa/[[path]].js'

      - name: Verify password hashing
        run: node scripts/auth-password-self-test.mjs

      - name: Verify TOTP implementation
        run: node scripts/mfa-self-test.mjs

      - name: Verify login middleware
        run: node scripts/auth-login-middleware-self-test.mjs

      - name: Verify admin account cutover
        run: node scripts/admin-cutover-self-test.mjs

      - name: Check PowerShell provisioning syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/setup-auth-production.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Build site
        run: npm run build
