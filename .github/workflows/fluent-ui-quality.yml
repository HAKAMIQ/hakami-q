name: Fluent UI Quality

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "astro.config.mjs"
      - "convert-blogger-live-to-astro.ps1"
      - "package.json"
      - "package-lock.json"
      - "functions/**"
      - "public/**"
      - "src/content.config.ts"
      - "src/content/**"
      - "src/data/blogger-pages.json"
      - "src/components/**"
      - "src/layouts/**"
      - "src/pages/**"
      - "src/styles/**"
      - "scripts/blogger-independence-quality.mjs"
      - "scripts/article-rendered-quality.mjs"
      - "scripts/content-source-cleanup.mjs"
      - "scripts/content-legacy-markup-cleanup.mjs"
      - "scripts/content-quality.mjs"
      - "scripts/security-audit.mjs"
      - "scripts/fluent-ui-quality.mjs"
      - "scripts/header-utility-quality.mjs"
      - "scripts/web-standards-quality.mjs"
      - "scripts/seo-quality.mjs"
      - "scripts/final-site-audit.mjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "astro.config.mjs"
      - "convert-blogger-live-to-astro.ps1"
      - "package.json"
      - "package-lock.json"
      - "functions/**"
      - "public/**"
      - "src/content.config.ts"
      - "src/content/**"
      - "src/data/blogger-pages.json"
      - "src/components/**"
      - "src/layouts/**"
      - "src/pages/**"
      - "src/styles/**"
      - "scripts/blogger-independence-quality.mjs"
      - "scripts/article-rendered-quality.mjs"
      - "scripts/content-source-cleanup.mjs"
      - "scripts/content-legacy-markup-cleanup.mjs"
      - "scripts/content-quality.mjs"
      - "scripts/security-audit.mjs"
      - "scripts/fluent-ui-quality.mjs"
      - "scripts/header-utility-quality.mjs"
      - "scripts/web-standards-quality.mjs"
      - "scripts/seo-quality.mjs"
      - "scripts/final-site-audit.mjs"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate complete site
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit exploit, injection and backdoor surfaces
        run: |
          npm run security:audit:report
          npm run security:audit

      - name: Validate auth and MFA syntax
        run: |
          node --check functions/_lib/auth.js
          node --check functions/_lib/google-auth.js
          node --check functions/_lib/member-audit.js
          node --check functions/_lib/mfa.js
          node --check functions/_lib/mfa-session.js
          node --check functions/admin/_middleware.js
          node --check functions/api/admin/_middleware.js
          node --check functions/api/auth/_middleware.js
          node --check 'functions/api/admin/[[path]].js'
          node --check 'functions/api/auth/[[path]].js'
          node --check 'functions/api/google/[[path]].js'
          node --check 'functions/api/mfa/[[path]].js'

      - name: Verify password hashing
        run: node scripts/auth-password-self-test.mjs

      - name: Verify Google identity validation
        run: node scripts/google-auth-self-test.mjs

      - name: Verify TOTP implementation
        run: node scripts/mfa-self-test.mjs

      - name: Verify login and privileged middleware
        run: node scripts/auth-login-middleware-self-test.mjs

      - name: Verify admin account cutover
        run: node scripts/admin-cutover-self-test.mjs

      - name: Guard Blogger independence
        run: npm run blogger:independence

      - name: Guard normalized article sources
        run: npm run content:cleanup:check

      - name: Guard clean legacy article markup
        run: npm run content:legacy-cleanup:check

      - name: Evaluate all article sources
        run: npm run content:quality:report

      - name: Require clean article sources
        run: npm run content:quality:strict

      - name: Evaluate Fluent UI invariants
        run: npm run ui:quality:report

      - name: Guard header utility metrics
        run: node scripts/header-utility-quality.mjs

      - name: Evaluate Web Components principles
        run: npm run web:quality

      - name: Validate article publisher function
        run: node --check 'functions/api/admin/[[path]].js'

      - name: Validate Astro production build
        run: npx astro build

      - name: Validate search metadata and sitemap
        run: npm run seo:quality

      - name: Audit rendered article compatibility
        run: npm run article:rendered-quality

      - name: Audit rendered pages, articles and links
        run: npm run final:audit:report

      - name: Upload quality and security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: final-site-quality-reports
          path: |
            reports/security-audit.json
            reports/content-quality.json
            reports/fluent-ui-quality.json
            reports/final-site-audit.json
          if-no-files-found: warn
          retention-days: 30
