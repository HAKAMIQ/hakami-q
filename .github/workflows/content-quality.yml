name: Content Quality

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**"
      - "scripts/content-quality.mjs"
      - "docs/content-engineering.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-quality.yml"
  pull_request:
    paths:
      - "src/content/blog/**"
      - "scripts/content-quality.mjs"
      - "docs/content-engineering.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-quality.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate editorial quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate article content
        run: npm run content:quality:report

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: content-quality-report
          path: reports/content-quality.json
          if-no-files-found: warn
          retention-days: 30
