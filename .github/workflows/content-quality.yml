name: Content Quality

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**"
      - "scripts/content-quality.mjs"
      - "docs/content-engineering.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-quality.yml"
  pull_request:
    paths:
      - "src/content/blog/**"
      - "scripts/content-quality.mjs"
      - "docs/content-engineering.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-quality.yml"

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate editorial quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate article content
        run: npm run content:quality:report

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: content-quality-report
          path: reports/content-quality.json
          if-no-files-found: warn
          retention-days: 30
